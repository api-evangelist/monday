  duplicate_board_with_pulses
  duplicate_board_with_pulses_and_updates
  duplicate_board_structure_only
}

type BoardDuplication {
  board: Board!
}

enum GroupAttribute {
  color
  relative_position_after
  relative_position_before
  title
}

enum ColumnProperty {
  description
  title
}

input ColumnMappingInput {
  source: String!
  target: String
}

