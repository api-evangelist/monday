  icon: String
}

# ─── Input Types ──────────────────────────────────────────────────────────────

input ItemsQuery {
  ids: [ID]
  rules: [ItemsQueryRule]
  operator: ItemsQueryRuleOperator
  order_by: [ItemsQueryOrderBy]
}

input ItemsQueryRule {
  column_id: String!
  compare_value: [String]
  compare_attribute: String
  operator: ItemsQueryRuleOperator
}

input ItemsQueryOrderBy {
  column_id: String!
  direction: ItemsQueryOrderByDirection
}

enum ItemsQueryRuleOperator {
  any_of
  not_any_of
  is_empty
  is_not_empty
  greater_than
  greater_than_or_equals
  lower_than
  lower_than_or_equal
  between
  not_contains_text
  contains_text
  contains_terms
  starts_with
  end_with
  within_the_next
  within_the_last
}

enum ItemsQueryOrderByDirection {
  asc
  desc
}

input CreateBoardInput {
  board_name: String!
  board_kind: BoardKind!
  workspace_id: ID
  folder_id: ID
  template_id: Int
  description: String
  board_owner_ids: [Int]
  board_subscriber_ids: [Int]
  board_owner_team_ids: [Int]
}

input UpdateBoardInput {
  board_attribute: BoardAttribute!
  new_value: String!
}

enum BoardAttribute {
  communication
  description
  name
}

input CreateGroupInput {
  group_name: String!
  relative_position_after: String
  relative_position_before: String
  color: String
  position: String
}

input CreateItemInput {
  item_name: String!
  board_id: ID!
  group_id: String
  column_values: JSON
  create_labels_if_missing: Boolean
}

input UpdateItemInput {
  item_id: ID!
  board_id: ID!
  column_values: JSON!
  create_labels_if_missing: Boolean
}

input ColumnValueInput {
  id: String!
  value: String!
}

input CreateColumnInput {
  board_id: ID!
  title: String!
  column_type: ColumnType!
  defaults: JSON
  description: String
  id: String
  after_column_id: String
}

input CreateWebhookInput {
  board_id: ID!
  url: String!
  event: WebhookEventType!
  config: JSON
}

input CreateWorkspaceInput {
  name: String!
  kind: WorkspaceKind!
  description: String
}

input UpdateWorkspaceInput {
  name: String
  kind: WorkspaceKind
  description: String
}

# ─── Query ────────────────────────────────────────────────────────────────────

type Query {
  """Fetch the currently authenticated account."""
  account: Account

  """Fetch details of the acting user."""
  me: User

  """Fetch all users or filter by IDs, kind, or email."""
  users(
    ids: [ID]
    kind: UserKind
    email: String
    newest_first: Boolean
    non_active: Boolean
    limit: Int
    page: Int
    name: String
  ): [User]

  """Fetch teams, optionally filtered by IDs."""
  teams(ids: [ID]): [Team]

  """Fetch boards, optionally filtered by various criteria."""
  boards(
    ids: [ID]
    board_kind: BoardKind
    limit: Int
    page: Int
    state: State
    order_by: BoardsOrderBy
    workspace_ids: [ID]
    folder_id: Int
  ): [Board]

  """Fetch items by IDs."""
  items(
    ids: [ID]!
    limit: Int
    page: Int
    newest_first: Boolean
    exclude_nonactive: Boolean
  ): [Item]

  """Fetch items from a board filtered by column values."""
  items_page_by_column_values(
    limit: Int!
    cursor: String
    board_id: ID!
    columns: [ItemsPageByColumnValuesQuery]
  ): ItemsPageByColumnValues

  """Fetch updates by IDs or item."""
  updates(
    ids: [ID]
    limit: Int
    page: Int
  ): [Update]

  """Fetch tags by IDs."""
  tags(ids: [ID]): [Tag]

  """Fetch workspaces."""
  workspaces(
    ids: [ID]
    kind: WorkspaceKind
    state: State
    limit: Int
    page: Int
    order_by: WorkspacesOrderBy
  ): [Workspace]

  """Fetch folders."""
  folders(
    ids: [ID]
    workspace_ids: [ID]
    limit: Int
    page: Int
  ): [Folder]

  """Fetch assets by IDs."""
  assets(ids: [ID]!): [Asset]

  """Fetch webhooks for a board."""
  webhooks(
    board_id: ID!
    app_webhooks_only: Boolean
  ): [Webhook]

  """Fetch complexity budget information."""
  complexity: Complexity

  """Fetch documents."""
  docs(
    ids: [ID]
    workspace_ids: [ID]
    object_ids: [ID]
    doc_kind: String
    limit: Int
    page: Int
    order_by: DocsOrderBy
  ): [Document]
}

enum BoardsOrderBy {
  created_at
  used_at
}

enum WorkspacesOrderBy {
  created_at
}

enum DocsOrderBy {
  created_at
}

input ItemsPageByColumnValuesQuery {
  column_id: String!
  column_values: [String]!
}

# ─── Mutation ─────────────────────────────────────────────────────────────────

type Mutation {
  """Create a new board."""
  create_board(
    board_name: String!
    board_kind: BoardKind!
    workspace_id: ID
    folder_id: ID
    template_id: Int
    description: String
    board_owner_ids: [Int]
    board_subscriber_ids: [Int]
  ): Board

  """Duplicate an existing board."""
  duplicate_board(
    board_id: ID!
    duplicate_type: DuplicateBoardType!
    board_name: String
    workspace_id: ID
    folder_id: ID
    keep_subscribers: Boolean
  ): BoardDuplication

  """Archive a board."""
  archive_board(board_id: ID!): Board

  """Delete a board."""
  delete_board(board_id: ID!): Board

  """Update a board attribute."""
  update_board(
    board_id: ID!
    board_attribute: BoardAttribute!
    new_value: String!
  ): JSON

  """Add subscribers to a board."""
  add_subscribers_to_board(
    board_id: ID!
    user_ids: [Int]!
    kind: SubscriberKind
  ): [BoardsSubscriber]

  """Delete a subscriber from a board."""
  delete_subscribers_from_board(
    board_id: ID!
    user_ids: [Int]!
  ): [BoardsSubscriber]

  """Create a group on a board."""
  create_group(
    board_id: ID!
    group_name: String!
