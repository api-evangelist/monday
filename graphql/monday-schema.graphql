  updated_at: ISO8601DateTime
}

type UpdateLikes {
  id: ID!
  reaction_type: String
}

type UpdateBoardRelation {
  id: ID!
  board: Board
}

type UpdatePinnedToTop {
  item_id: String
}

"""A reply to an update."""
type Reply {
  id: ID!
