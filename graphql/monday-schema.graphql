"""
Monday.com GraphQL API Schema
Source: https://developer.monday.com/api-reference/
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar ISO8601DateTime
scalar JSON
scalar Upload

# ─── Enums ────────────────────────────────────────────────────────────────────

enum BoardType {
  board
  sub_items_board
  document
  custom_object
}

enum BoardKind {
  public
  private
  share
}

enum ColumnType {
  auto_number
  board_relation
  button
  checkbox
  color_picker
  country
  creation_log
  date
  dependency
  doc
  dropdown
  email
  file
  formula
  hour
  item_assignees
  item_id
  last_updated
  link
  location
  long_text
  mirror
  name
  numbers
  people
  phone
  progress
  rating
  status
  subtasks
  tags
  team
  text
  timeline
  time_tracking
  vote
  week
  world_clock
}

enum UserKind {
  all
  non_guests
  guests
  non_pending
}

enum WorkspaceKind {
  open
  closed
}

enum PlanVersion {
  free
  basic
  standard
  pro
  enterprise
}

enum ViewType {
  BoardView
  WorkspaceView
}

enum WebhookEventType {
  create_item
  create_update
  change_column_value
  change_specific_column_value
  change_status_column_value
  change_subitem_column_value
  create_subitem
  create_subitem_update
  move_item_to_board
  move_item_to_group
  item_deleted
  item_archived
  item_restored
  column_values_updated
  board_deleted
  board_archived
}

enum State {
  active
  all
  archived
  deleted
}

enum SubscriberKind {
  owner
  subscriber
}

enum NotificationTargetType {
  Project
  Post
}

# ─── Core Object Types ────────────────────────────────────────────────────────

"""A monday.com account (organisation)."""
type Account {
  id: ID!
  name: String!
  slug: String
  logo: String
  plan: Plan
  country_code: String
  first_day_of_the_week: String
  show_timeline_weekends: Boolean
  tier: String
  products: [AccountProduct]
}

type AccountSlug {
  id: ID!
  slug: String!
}

type AccountProduct {
  id: ID
  kind: String
}

"""A subscription plan for an account."""
type Plan {
  max_users: Int!
  period: String
  tier: String
  version: PlanVersion
}

"""An API key object."""
type APIKey {
  id: ID!
  name: String!
  created_at: ISO8601DateTime
  last_used_at: ISO8601DateTime
}

# ─── User & Team ──────────────────────────────────────────────────────────────

"""A monday.com user."""
type User {
  id: ID!
  name: String!
  email: String!
  url: String
  photo_original: String
  photo_thumb: String
  photo_thumb_small: String
  photo_tiny: String
  created_at: ISO8601DateTime
  updated_at: ISO8601DateTime
  birthday: String
  country_code: String
  is_admin: Boolean
  is_guest: Boolean
  is_pending: Boolean
  is_view_only: Boolean
  join_date: String
  location: String
  mobile_phone: String
  phone: String
  time_zone_identifier: String
  title: String
  uid: ID!
  account: Account
  teams: [Team]
  sign_up_product_kind: String
  enabled: Boolean
  current_language: String
}

"""Minimal user details returned in nested contexts."""
type UserDetails {
  id: ID!
  name: String!
  email: String!
  photo_thumb: String
}

"""A monday.com team."""
type Team {
  id: ID!
  name: String!
  picture_url: String
  users: [User]
}

"""Minimal team details returned in nested contexts."""
type TeamDetails {
  id: ID!
  name: String!
  picture_url: String
}

# ─── Workspace ────────────────────────────────────────────────────────────────

"""A monday.com workspace."""
type Workspace {
  id: ID!
  name: String!
  kind: WorkspaceKind!
  description: String
  created_at: ISO8601DateTime
  owners_subscribers: [User]
  teams_subscribers: [Team]
  users_subscribers: [User]
  settings: WorkspaceSettings
  state: State
  is_default_workspace: Boolean
  account_product: AccountProduct
}

"""Minimal workspace details returned in nested contexts."""
type WorkspaceDetails {
  id: ID!
  name: String!
  kind: WorkspaceKind!
}

type WorkspaceSettings {
  icon: WorkspaceIcon
}

type WorkspaceIcon {
  image: String
  color: String
}

# ─── Board ────────────────────────────────────────────────────────────────────

"""A monday.com board."""
type Board {
  id: ID!
  name: String!
  description: String
  board_folder_id: ID
  board_kind: BoardKind!
  type: BoardType
  columns: [Column]
  communication: JSON
  creator: User
  groups: [Group]
  items_count: Int
  items_page(limit: Int, cursor: String, query_params: ItemsQuery): ItemsPage
  owners: [User]
  permissions: String
  state: State
  subscribers: [User]
  tags: [Tag]
  team_owners: [Team]
  team_subscribers: [Team]
  top_group: Group
  updated_at: ISO8601DateTime
  url: String
  views: [BoardView]
  workspace: Workspace
  workspace_id: ID
}

"""Minimal board details returned in nested contexts."""
type BoardDetails {
  id: ID!
  name: String!
  board_kind: BoardKind!
}

"""A subscriber (user) of a board."""
type BoardsSubscriber {
  id: ID!
  name: String!
  email: String!
  kind: SubscriberKind
}

# ─── Column ───────────────────────────────────────────────────────────────────

"""A column definition on a board."""
type Column {
  id: ID!
  archived: Boolean
  description: String
  settings_str: String
  title: String!
  type: ColumnType!
  width: Int
}

"""Minimal column details returned in nested contexts."""
type BoardColumn {
  id: ID!
  title: String!
  type: ColumnType!
}

# ─── Group ────────────────────────────────────────────────────────────────────

"""A group of items on a board."""
type Group {
  id: ID!
  title: String!
  archived: Boolean
  color: String
  deleted: Boolean
  items_page(limit: Int, cursor: String): ItemsPage
  position: String
}

"""Minimal group details."""
type GroupDetails {
  id: ID!
  title: String!
  color: String
}

# ─── Item ─────────────────────────────────────────────────────────────────────

"""A monday.com item (row on a board)."""
type Item {
  id: ID!
  name: String!
  assets: [Asset]
  board: Board
  column_values: [ColumnValue]
  created_at: ISO8601DateTime
  creator: User
  creator_id: String
  email: String
  group: Group
  linked_items: [Item]
  parent_item: Item
  relative_link: String
  state: State
  subitems: [Item]
  subscribers: [User]
  updated_at: ISO8601DateTime
  updates(limit: Int, page: Int): [Update]
  url: String
}

"""Minimal item details returned in nested contexts."""
type ItemDetails {
  id: ID!
  name: String!
  state: State
}

"""A column value entry on an item."""
type ItemColumn {
  id: ID!
  title: String!
  value: String
  text: String
  type: ColumnType!
}

"""A paginated page of items."""
type ItemsPage {
  cursor: String
  items: [Item]!
}

"""Items page filtered by column values."""
type ItemsPageByColumnValues {
  cursor: String
  items: [Item]!
}

"""Cursor for paginating items."""
type Cursor {
  cursor: String!
}

