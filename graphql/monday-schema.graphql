# ─── Subscription ─────────────────────────────────────────────────────────────

type Subscription {
  """Subscribe to item created events on a board."""
  item_created(board_id: ID!): Event

  """Subscribe to item deleted events on a board."""
  item_deleted(board_id: ID!): Event

  """Subscribe to column value changed events."""
  column_values_updated(board_id: ID!): Event
}

